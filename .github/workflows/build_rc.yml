name: Build Release Candidate
concurrency:
  group: Build-Release-Candidate-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [trigger_rc_build]

  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Version of the release candidate (X.Y.Z)."
        required: true
      rc_number:
        type: string
        description: "Release candidate number (e.g., rc1, rc2, etc.)."
        required: true
      overwrite_tag:
        type: boolean
        description: "Overwrite the existing tag if it exists."
        default: false
      initial_branch:
        type: string
        description: "Branch to start build from"
        default: ''

run-name: Build Release Candidate

jobs:
  ParseInputs:
    name: Parse Inputs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.set-outputs.outputs.version }}
      short_version: ${{ steps.set-outputs.outputs.short_version }}
      rc_number: ${{ steps.set-outputs.outputs.rc_number }}
      overwrite_tag: ${{ steps.set-outputs.outputs.overwrite_tag }}
    steps:
      - name: Determine version, rc_number, overwrite_tag
        id: set-outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RC_NUMBER: ${{ github.event.inputs.rc_number }}
          INPUT_OVERWRITE_TAG: ${{ github.event.inputs.overwrite_tag }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_SHORT_VERSION: ${{ github.event.client_payload.short_version }}
          PAYLOAD_RC_NUMBER: ${{ github.event.client_payload.rc_number }}
          PAYLOAD_OVERWRITE_TAG: ${{ github.event.client_payload.overwrite_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            short_version=$(printf '%s\n' "$INPUT_VERSION" | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')
            rc_number="$INPUT_RC_NUMBER"
            overwrite_tag="${INPUT_OVERWRITE_TAG:-false}"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            version="$PAYLOAD_VERSION"
            short_version="${PAYLOAD_SHORT_VERSION:-$(printf '%s\n' "$PAYLOAD_VERSION" | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')}"
            rc_number="$PAYLOAD_RC_NUMBER"
            overwrite_tag="${PAYLOAD_OVERWRITE_TAG:-false}"
          else
            echo "❌ Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version: $version" >&2
            exit 1
          fi
          if ! [[ "$short_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ Invalid short_version: $short_version" >&2
            exit 1
          fi
          if ! [[ "$rc_number" =~ ^rc[0-9]+$ ]]; then
            echo "❌ Invalid rc_number: $rc_number" >&2
            exit 1
          fi
          if ! [[ "$overwrite_tag" =~ ^(true|false)$ ]]; then
            echo "❌ Invalid overwrite_tag: $overwrite_tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "short_version=$short_version"
            echo "rc_number=$rc_number"
            echo "overwrite_tag=$overwrite_tag"
          } >> "$GITHUB_OUTPUT"

  PrepareReleaseBranch:
    name: Prepare Release Branch
    needs: ParseInputs
    runs-on: ubuntu-24.04
    outputs:
      branch_name: ${{ steps.check_branch.outputs.branch_name }}
      tag_name: ${{ steps.check_tag.outputs.tag_name }}
    env:
      VERSION:       ${{ needs.ParseInputs.outputs.version }}
      SHORT_VERSION: ${{ needs.ParseInputs.outputs.short_version }}
      RC_NUMBER:     ${{ needs.ParseInputs.outputs.rc_number }}
      OVERWRITE_TAG: ${{ needs.ParseInputs.outputs.overwrite_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          fetch-tags: true
          ref: ${{ inputs.initial_branch != '' && inputs.initial_branch || github.ref }}

      - name: Set up Git user
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

      - name: Check if release branch exists and checkout
        id: check_branch
        run: |
          branch_name="release/${SHORT_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch_name"; then
            echo "Branch $branch_name exists. Checking out."
            git checkout "$branch_name"
          else
            echo "Branch $branch_name does not exist. Creating a new branch."
            git checkout -b "$branch_name"
          fi
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          tag_name="v${VERSION}-${RC_NUMBER}"
          if git ls-remote --exit-code --tags origin "$tag_name"; then
            echo "Tag $tag_name exists."
            if [ "${OVERWRITE_TAG}" == "true" ]; then
              echo "Overwriting existing tag."
              git tag -d "$tag_name"
              git push origin ":refs/tags/$tag_name"
            else
              echo "Skipping tag creation as it already exists."
              exit 1
            fi
          else
            echo "Tag $tag_name does not exist. Proceeding to create a new tag."
          fi
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT

      - name: Update Memgraph submodule
        env:
          TAG_NAME: ${{ steps.check_tag.outputs.tag_name }}
        run: |
          cd cpp/memgraph
          git fetch origin
          git checkout "$TAG_NAME"
          cd ../..
          git add .
          git commit -m "Update Memgraph submodule to tag $TAG_NAME [skip tests]" || true

      - name: Create and push tag
        env:
          BRANCH_NAME: ${{ steps.check_branch.outputs.branch_name }}
          TAG_NAME: ${{ steps.check_tag.outputs.tag_name }}
        run: |
          git push --set-upstream origin "$BRANCH_NAME"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"


  CreateReleaseArtifacts:
    name: Create Release Artifacts
    needs: [ParseInputs, PrepareReleaseBranch]
    uses: ./.github/workflows/release_artifacts.yaml
    with:
      os: "ubuntu-24.04"
      mage_version: "${{ needs.ParseInputs.outputs.version }}-${{ needs.ParseInputs.outputs.rc_number }}"
      memgraph_version: "${{ needs.ParseInputs.outputs.version }}-${{ needs.ParseInputs.outputs.rc_number }}"
      run_smoke_tests: true
      ref: "${{ needs.PrepareReleaseBranch.outputs.tag_name }}"
      memgraph_ref: "${{ needs.PrepareReleaseBranch.outputs.tag_name }}"
      memgraph_ref_update: false
      run_tests: true
    secrets: inherit
