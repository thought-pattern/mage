name: Check Pip Conflicts

on:
  pull_request:
    paths:
      - "python/requirements*.txt"
      - "python/tests/requirements.txt"
      - "scripts/requirements-cve-scan.txt"
      - "smoke-release-testing/requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  push:
    branches: [develop, main]
    paths:
      - "python/requirements*.txt"
      - "python/tests/requirements.txt"
      - "scripts/requirements-cve-scan.txt"
      - "smoke-release-testing/requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-conflicts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pip-conflicts:
    name: Resolve ${{ matrix.requirements }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - python/requirements.txt
          - python/requirements-gpu.txt
          - python/tests/requirements.txt
          - scripts/requirements-cve-scan.txt
          - smoke-release-testing/requirements.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: python -m pip install pip-tools packaging

      - name: Check for conflicts
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          from pathlib import Path
          from packaging.requirements import Requirement

          source = Path(os.environ["REQUIREMENTS"])
          active_lines = []
          for raw in source.read_text(encoding="utf-8").splitlines():
              text = raw.split(" #", 1)[0].strip()
              if not text or text.startswith("#"):
                  continue
              if text.startswith("-"):
                  active_lines.append(text)
                  continue
              req = Requirement(text)
              if req.marker is not None and not req.marker.evaluate():
                  continue
              extras = f"[{','.join(sorted(req.extras))}]" if req.extras else ""
              active_lines.append(f"{req.name}{extras} @ {req.url}" if req.url else f"{req.name}{extras}{req.specifier}")

          target = source.with_name(f".ci-resolve-{source.name}")
          target.write_text("\n".join(active_lines) + ("\n" if active_lines else ""), encoding="utf-8")
          EOF
          TARGET="$(dirname "$REQUIREMENTS")/.ci-resolve-$(basename "$REQUIREMENTS")"
          trap 'rm -f "$TARGET"' EXIT
          echo "Resolving $REQUIREMENTS..."
          if pip-compile "$TARGET" \
              --dry-run \
              --quiet \
              --no-header \
              --strip-extras \
              --output-file=- > resolution.log 2>&1; then
            echo "No conflicts found in $REQUIREMENTS"
          else
            echo "::error file=$REQUIREMENTS::Dependency conflicts detected in $REQUIREMENTS"
            grep -E "ERROR|conflict|ResolutionImpossible|requires|depends on" resolution.log || cat resolution.log
            exit 1
          fi
