[tool.ruff]
line-length = 132
target-version = "py312"
extend-exclude = ["cpp", "rust"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "N811", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["mage"]

[tool.black]
line-length = 132
target-version = ["py311"]
extend-exclude = "^/(cpp|rust)/"

[tool.isort]
profile = "black"
line_length = 132
combine_as_imports = true
force_sort_within_sections = true
known_first_party = ["mage"]
extend_skip = ["cpp", "rust"]

[tool.pyright]
include = ["python", "scripts", "smoke-release-testing", "e2e", "e2e_correctness"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "cpp", "rust"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportImportCycles = "error"

[tool.vulture]
paths = ["python", "scripts", "smoke-release-testing", "e2e", "e2e_correctness"]
exclude = ["*/cpp/*", "*/rust/*"]
min_confidence = 65
ignore_names = ["exc_type", "exc_value", "traceback", "unused_*"]

[tool.bandit]
exclude_dirs = ["/.venv/", "/cpp/", "/rust/"]
